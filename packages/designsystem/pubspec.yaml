name: boveda_designsystem
description: "Bóveda's design system: steel-and-brass theme, Atkinson Hyperlegible type, icons and components."
publish_to: none
version: 1.0.0
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: AtkinsonHyperlegibleNext
      fonts:
        - asset: fonts/AtkinsonHyperlegibleNext-Regular.ttf
          weight: 400
        - asset: fonts/AtkinsonHyperlegibleNext-Medium.ttf
          weight: 500
        - asset: fonts/AtkinsonHyperlegibleNext-SemiBold.ttf
          weight: 600
        - asset: fonts/AtkinsonHyperlegibleNext-Bold.ttf
          weight: 700
    - family: AtkinsonHyperlegibleMono
      fonts:
        - asset: fonts/AtkinsonHyperlegibleMono-Regular.ttf
          weight: 400
        - asset: fonts/AtkinsonHyperlegibleMono-Medium.ttf
          weight: 500
        - asset: fonts/AtkinsonHyperlegibleMono-SemiBold.ttf
          weight: 600
        - asset: fonts/AtkinsonHyperlegibleMono-Bold.ttf
          weight: 700
