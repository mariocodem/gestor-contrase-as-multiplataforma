name: boveda_data
description: "Bóveda's data layer: device-side encryption, the Cloudflare D1 API client, offline cache and sync, biometric key storage and settings."
publish_to: none
version: 1.0.0
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  boveda_domain:
    path: ../domain
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  rxdart: ^0.28.0
  shared_preferences: ^2.5.6
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
